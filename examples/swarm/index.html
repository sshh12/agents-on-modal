<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aom swarm dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e6e9ef;
    --muted: #8b93a3; --accent: #6ea8fe; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
    --sel: #1b2233; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  main { padding: 16px; }
  form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 14px; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }
  form .wide { grid-column: 1 / -1; }
  label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  input, select, textarea, button { font: inherit; color: var(--text); background: #0d0f14;
    border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; width: 100%; }
  textarea { font-family: var(--mono); min-height: 64px; resize: vertical; }
  .check { display: flex; align-items: center; gap: 8px; }
  .check input { width: auto; }
  button { background: var(--accent); color: #0b1020; border: none; font-weight: 650; cursor: pointer; }
  button.ghost { background: #0d0f14; color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  details.injected { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 14px; }
  details.injected summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.injected pre { font-family: var(--mono); font-size: 11px; white-space: pre-wrap;
    max-height: 300px; overflow-y: auto; color: var(--text); margin: 10px 0 0; }

  .layout { display: flex; gap: 14px; align-items: flex-start; }
  .explorer { flex: 0 0 310px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; position: sticky; top: 16px;
    max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .detail { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .files { flex: 0 0 280px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; position: sticky; top: 16px;
    max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .phead { font-size: 12px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-family: var(--mono); display: flex; justify-content: space-between; align-items: center;
    flex: 0 0 auto; }
  .tree { overflow-y: auto; padding: 4px 0; }

  .node { display: flex; align-items: center; gap: 6px; padding: 3px 10px; font-family: var(--mono);
    font-size: 12px; white-space: nowrap; }
  .node .lbl { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .node.clickable { cursor: pointer; }
  .node.clickable:hover { background: #0d0f14; }
  .node.sel { background: var(--sel); }
  .node.orch .lbl { color: var(--accent); font-weight: 650; }
  .node.wf { font-weight: 650; cursor: pointer; }
  .node.wf .tw { color: var(--muted); width: 10px; display: inline-block; }
  .node.stage { padding-left: 24px; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: .03em; }
  .node.agent { padding-left: 34px; }
  .node .cnt { color: var(--muted); font-size: 10px; }

  .state { font-size: 10px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border);
    flex: 0 0 auto; }
  .state.running, .state.starting, .state.pending { color: var(--warn); }
  .state.done { color: var(--ok); } .state.paused { color: var(--muted); }
  .state.failed, .state.timeout, .state.cancelled { color: var(--err); }

  .dhead { padding: 10px 12px; border-bottom: 1px solid var(--border); font-family: var(--mono);
    font-size: 12px; display: flex; justify-content: space-between; align-items: center; flex: 0 0 auto; }
  .dhead .who { overflow: hidden; text-overflow: ellipsis; }
  .trace { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
    padding: 10px 12px; overflow-y: auto; margin: 0; flex: 1; min-height: 320px;
    max-height: calc(100vh - 120px); }
  .ev { padding: 1px 0; }
  .ev.thinking { color: var(--muted); } .ev.tool_call { color: var(--accent); }
  .ev.tool_result { color: #a0d8c0; } .ev.error { color: var(--err); }
  .ev.status, .ev.usage, .ev.compaction, .ev.session { color: var(--muted); }
  .ev.goal { color: var(--warn); }

  .ftree { overflow-y: auto; padding: 6px 0; font-family: var(--mono); font-size: 12px; }
  .ftree .f { padding: 2px 12px; cursor: pointer; white-space: pre; color: var(--text); }
  .ftree .f:hover { background: #0d0f14; }
  .fview { border-top: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
  .fview .path { padding: 6px 12px; color: var(--accent); font-family: var(--mono); font-size: 11px; }
  .fview pre { margin: 0; padding: 0 12px 12px; font-family: var(--mono); font-size: 11px;
    white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
  #error { color: var(--err); font-family: var(--mono); font-size: 12px; min-height: 16px; }
  .empty { color: var(--muted); padding: 20px; font-size: 13px; }
  @media (max-width: 980px) {
    .layout { flex-direction: column; }
    .explorer, .files { position: static; width: 100%; flex: none; max-height: 340px; }
  }
</style>
</head>
<body>
<header>
  <h1>aom swarm</h1>
  <span class="meta" id="swarmMeta">no swarm</span>
  <span id="error"></span>
</header>
<main>
  <form id="spawn">
    <div><label for="mode">mode</label>
      <select id="mode"><option value="naive">naive (N identical)</option>
        <option value="dynamic">dynamic (orchestrator)</option></select></div>
    <div><label for="harness">harness</label>
      <select id="harness"><option>claude</option><option>codex</option></select></div>
    <div><label for="model">model</label>
      <select id="model"><option value="qwen3.8-27b">qwen3.8-27b</option></select></div>
    <div id="countWrap"><label for="count">count</label>
      <input id="count" type="number" min="1" value="4" /></div>
    <div><label for="timeout" id="timeoutLabel">timeout (s)</label>
      <input id="timeout" type="number" min="0" placeholder="none" /></div>
    <div><label for="effort">effort</label>
      <select id="effort"><option value="">default</option><option>low</option>
        <option>medium</option><option>high</option><option>xhigh</option><option>max</option></select></div>
    <div><label for="maxInst">max instances</label>
      <input id="maxInst" type="number" min="0" value="1"
        title="endpoint max GPU containers (live autoscaler cap). 1 = cap at one, throttle gracefully. 0 or blank = unbounded (leave at catalog default)." /></div>
    <div class="check" id="goalWrap"><input id="goal" type="checkbox" />
      <label for="goal" style="margin:0">use /goal</label></div>
    <div><label for="proxyMode">proxies</label>
      <select id="proxyMode" disabled
        title="agent browser/web egress (model inference ALWAYS stays direct). always = route all agent web/browser through a residential proxy, each agent a distinct sticky IP. agent opt-in = direct by default, but the agent is given the proxy endpoints to use only when a site blocks the direct IP (saves cost). off = no proxy.">
        <option value="optin">agent opt-in</option>
        <option value="always">always on</option>
        <option value="off">off</option>
      </select></div>
    <div class="wide"><label for="prompt">prompt</label>
      <textarea id="prompt" placeholder="what should the swarm do?"></textarea></div>
    <div class="wide" style="display:flex; gap:10px;">
      <button type="submit" id="spawnBtn" style="flex:1">spawn swarm</button>
      <select id="presetSel" class="ghost" style="flex:0 0 auto; width:auto; min-width:160px"
        title="load a preset">
        <option value="">presets…</option>
      </select>
      <button type="button" id="presetBtn" class="ghost" style="flex:0 0 auto">load preset</button>
    </div>
  </form>

  <details class="injected" id="injectedPanel" style="display:none">
    <summary>injected orchestrator context (shown exactly as the orchestrator receives it)</summary>
    <pre id="injectedText">loading…</pre>
  </details>

  <div class="layout">
    <aside class="explorer">
      <div class="phead"><span>run</span><span class="meta" id="treeCount"></span></div>
      <div class="tree" id="tree"><div class="empty">No run yet. Spawn one above, or open
        <code>?swarm=&lt;id&gt;</code>.</div></div>
    </aside>
    <section class="detail">
      <div class="dhead"><span class="who" id="dtitle">no agent selected</span>
        <span class="state" id="dstate"></span></div>
      <pre class="trace" id="dtrace"><div class="empty">Select an agent on the left to see its
        live or completed trace.</div></pre>
    </section>
    <aside class="files" id="filesPanel" style="display:none">
      <div class="phead"><span id="filesTitle">/shared</span><span class="meta" id="filesCount"></span></div>
      <div class="ftree" id="ftree"></div>
      <div class="fview" id="fview" style="display:none">
        <div class="path" id="fpath"></div><pre id="fbody"></pre>
      </div>
    </aside>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const TERMINAL = ["done", "timeout", "failed", "cancelled"];
let swarmId = qs.get("swarm") || "";
let mode = "naive";
let selected = null;                 // selected agent id
let openFile = null;
const expanded = new Set();          // expanded workflow names
const runIds = new Map();            // agentId -> run_id
const traces = new Map();            // agentId -> {events, offset, done, runId}

function setError(msg) { $("error").textContent = msg || ""; }

async function getJSON(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
function short(v) {
  const s = typeof v === "string" ? v : JSON.stringify(v);
  return s && s.length > 300 ? s.slice(0, 299) + "…" : (s || "");
}
function stateBadge(state) {
  const sp = document.createElement("span");
  sp.className = "state " + (state || "");
  sp.textContent = state || "?";
  return sp;
}

// --------------------------------------------------------------------------- trace detail
function renderEvent(ev) {
  const div = document.createElement("div");
  div.className = "ev " + ev.kind;
  const d = ev.data || {};
  let text = "";
  switch (ev.kind) {
    case "text": text = d.text || ""; break;
    case "thinking": text = "(thinking) " + (d.text || ""); break;
    case "tool_call": text = "> " + (d.name || "?") + " " + JSON.stringify(d.input || {}); break;
    case "tool_result": text = "< " + (d.is_error ? "error " : "") + short(d.output); break;
    case "usage": text = "[usage in=" + d.input_tokens + " out=" + d.output_tokens + "]"; break;
    case "compaction": text = "[compaction]"; break;
    case "subagent": text = "[subagent " + (d.id || "") + " " + (d.status || "") + "]"; break;
    case "goal": text = "[goal " + (d.status || "") + "] " + (d.reason || ""); break;
    case "turn_end": text = d.result ? short(d.result) : ""; break;
    case "error": text = "[error] " + (d.message || ""); break;
    case "status": text = "[" + (d.event || "status") + "]"; break;
    case "session": text = "-- session " + (d.session_id || ""); break;
    default: text = d.text || JSON.stringify(d);
  }
  if (!text) return null;
  div.textContent = text;
  return div;
}

function selectAgent(id, title) {
  selected = id;
  $("dtitle").textContent = title || id;
  const t = traces.get(id);
  const pre = $("dtrace");
  pre.innerHTML = "";
  if (t && t.events.length) {
    for (const ev of t.events) { const n = renderEvent(ev); if (n) pre.appendChild(n); }
    pre.scrollTop = pre.scrollHeight;
  } else {
    pre.innerHTML = '<div class="empty">waiting for trace…</div>';
  }
  highlightSelection();
  pollSelected();
}

function highlightSelection() {
  for (const el of document.querySelectorAll(".node.agentnode"))
    el.classList.toggle("sel", el.dataset.id === selected);
}

async function pollSelected() {
  if (!selected) return;
  const id = selected, runId = runIds.get(id);
  if (!runId) return;
  let t = traces.get(id);
  if (!t) { t = { events: [], offset: 0, done: false, runId, source: "" }; traces.set(id, t); }
  try {
    const data = await getJSON("/api/events?swarm=" + encodeURIComponent(swarmId)
      + "&agent=" + encodeURIComponent(id)
      + "&run=" + encodeURIComponent(runId) + "&offset=" + t.offset);
    t.offset = data.offset; t.done = data.done;
    const pre = $("dtrace");
    if (data.source === "persisted") {
      // The live sandbox is gone; the server returned the whole durable trace. Replace once
      // (idempotent across ticks) rather than appending, and only re-render when it changed.
      if (t.source !== "persisted" || (data.events || []).length !== t.events.length) {
        t.events = data.events || [];
        if (selected === id) {
          pre.innerHTML = "";
          for (const ev of t.events) { const n = renderEvent(ev); if (n) pre.appendChild(n); }
          pre.scrollTop = pre.scrollHeight;
        }
      }
    } else {
      const fresh = data.events || [];
      if (fresh.length) {
        const empty = pre.querySelector(".empty"); if (empty) empty.remove();
        t.events.push(...fresh);
        if (selected === id) {
          const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
          for (const ev of fresh) { const n = renderEvent(ev); if (n) pre.appendChild(n); }
          if (atBottom) pre.scrollTop = pre.scrollHeight;
        }
      }
    }
    t.source = data.source || "live";
    if (selected === id) {
      $("dstate").textContent = data.state; $("dstate").className = "state " + data.state;
    }
  } catch (e) { /* transient */ }
}

// --------------------------------------------------------------------------- run tree
function node(cls, label, state, { clickable, id, title, onclick } = {}) {
  const el = document.createElement("div");
  el.className = "node " + cls + (clickable ? " clickable" : "");
  if (clickable) el.classList.add("agentnode");
  if (id) el.dataset.id = id;
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = label; if (title) lbl.title = title;
  el.appendChild(lbl);
  if (state) el.appendChild(stateBadge(state));
  if (onclick) el.onclick = onclick;
  return el;
}

function renderTree(data) {
  const tree = $("tree");
  tree.innerHTML = "";
  const agents = data.agents || [];
  const workflows = data.workflows || [];
  runIds.clear();
  for (const a of agents) if (a.run_id) runIds.set(a.id, a.run_id);

  const orch = agents.find((a) => a.role === "orchestrator");
  if (orch) {
    tree.appendChild(node("orch", "orchestrator", orch.state,
      { clickable: true, id: orch.id, title: orch.id,
        onclick: () => selectAgent(orch.id, "orchestrator") }));
  }

  if (mode === "dynamic") {
    if (!workflows.length && !orch)
      tree.appendChild(elEmpty("orchestrator is planning… no workflows submitted yet"));
    for (const wf of workflows) {
      const stages = wf.stages || [];
      const open = expanded.has(wf.name);
      const head = node("wf", (open ? "▾ " : "▸ ") + wf.name, wf.status,
        { title: wf.name + " — " + stages.length + " stage(s)" });
      head.onclick = () => { open ? expanded.delete(wf.name) : expanded.add(wf.name); renderTree(data); };
      tree.appendChild(head);
      if (!open) continue;
      for (const st of stages) {
        const sas = st.agents || [];
        const done = sas.filter((a) => TERMINAL.includes(a.state)).length;
        const sh = node("stage", st.name, st.status, { title: st.name });
        const cnt = document.createElement("span");
        cnt.className = "cnt"; cnt.textContent = done + "/" + sas.length;
        sh.insertBefore(cnt, sh.querySelector(".state"));
        tree.appendChild(sh);
        for (const a of sas) {
          if (a.run_id) runIds.set(a.id, a.run_id);
          const label = "agent " + (a.idx !== undefined && a.idx !== null ? a.idx : "?");
          tree.appendChild(node("agent", label, a.state,
            { clickable: true, id: a.id, title: a.id,
              onclick: () => selectAgent(a.id, wf.name + " · " + st.name + " · " + label) }));
        }
      }
    }
  } else {
    for (const a of agents.filter((x) => x.role !== "orchestrator")) {
      const label = "agent " + (a.idx !== undefined && a.idx !== null ? a.idx : a.id.slice(0, 10));
      tree.appendChild(node("agent", label, a.state,
        { clickable: true, id: a.id, title: a.id, onclick: () => selectAgent(a.id, label) }));
    }
  }
  if (!tree.children.length) tree.appendChild(elEmpty("no agents yet"));
  $("treeCount").textContent = agents.length + " agent" + (agents.length === 1 ? "" : "s");
  highlightSelection();
}

function elEmpty(msg) { const d = document.createElement("div"); d.className = "empty"; d.textContent = msg; return d; }

// --------------------------------------------------------------------------- refresh loop
async function refresh() {
  if (!swarmId) return;
  try {
    const data = await getJSON("/api/agents?swarm=" + encodeURIComponent(swarmId));
    setError("");
    mode = data.mode || "naive";
    $("swarmMeta").textContent = data.swarm + " · " + (data.model || "?") + " · " + mode
      + " · " + (data.agents || []).length + " agents";
    renderTree(data);
    // auto-select the orchestrator (dynamic) or the first agent (naive) once.
    if (!selected && (data.agents || []).length) {
      const orch = data.agents.find((a) => a.role === "orchestrator");
      const first = orch || data.agents[0];
      if (first) selectAgent(first.id, orch ? "orchestrator"
        : ("agent " + (first.idx != null ? first.idx : first.id.slice(0, 10))));
    }
    if (selected) { const t = traces.get(selected); if (!t || !t.done) pollSelected(); }
    if (mode === "dynamic") { $("filesPanel").style.display = ""; refreshFiles(); }
    else $("filesPanel").style.display = "none";
  } catch (e) { setError(String(e.message || e)); }
}

// --------------------------------------------------------------------------- file explorer
async function refreshFiles() {
  if (!swarmId) return;
  try {
    const data = await getJSON("/api/files?swarm=" + encodeURIComponent(swarmId) + "&path=/");
    const paths = data.paths || [];
    $("filesCount").textContent = paths.length + " files";
    const tree = $("ftree"); tree.innerHTML = "";
    for (const p of paths) {
      const depth = (p.match(/\//g) || []).length;
      const div = document.createElement("div");
      div.className = "f";
      div.textContent = "  ".repeat(Math.max(0, depth - 1)) + p.split("/").filter(Boolean).pop();
      div.title = p;
      div.onclick = () => viewFile(p);
      tree.appendChild(div);
    }
    if (openFile) viewFile(openFile);
  } catch (e) { /* no volume yet */ }
}

async function viewFile(path) {
  openFile = path;
  try {
    const data = await getJSON("/api/file?swarm=" + encodeURIComponent(swarmId)
      + "&path=" + encodeURIComponent(path));
    $("fview").style.display = "";
    $("fpath").textContent = data.path + (data.truncated ? "  (truncated)" : "");
    $("fbody").textContent = data.text || "(empty)";
  } catch (e) { setError(String(e.message || e)); }
}

// --------------------------------------------------------------------------- form
async function loadModels() {
  try {
    const data = await getJSON("/api/models");
    const sel = $("model"); const cur = sel.value || "qwen3.8-27b";
    sel.innerHTML = "";
    for (const m of (data.models || [])) {
      const o = document.createElement("option");
      o.value = m.name;
      // show the full Hugging Face repo alongside the catalog name (value stays the catalog name)
      o.textContent = m.repo ? m.name + " — " + m.repo : m.name;
      o.title = (m.repo ? m.repo + "\n" : "") + (m.gpu ? m.gpu + " · " : "")
        + (m.context_window ? m.context_window + " ctx · " : "") + (m.description || "");
      sel.appendChild(o);
    }
    if (!sel.options.length) { const o = document.createElement("option"); o.value = cur; o.textContent = cur; sel.appendChild(o); }
    if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
  } catch (e) { /* keep the default option */ }
}

async function loadInjected() {
  if ($("mode").value !== "dynamic") { $("injectedPanel").style.display = "none"; return; }
  $("injectedPanel").style.display = "";
  try {
    const data = await getJSON("/api/injected?harness=" + encodeURIComponent($("harness").value)
      + "&model=" + encodeURIComponent($("model").value.trim()));
    $("injectedText").textContent = data.text || "";
  } catch (e) { $("injectedText").textContent = "could not load: " + (e.message || e); }
}

function applyMode() {
  const dyn = $("mode").value === "dynamic";
  $("countWrap").style.display = dyn ? "none" : "";
  $("goalWrap").style.display = dyn ? "none" : "";
  $("timeoutLabel").textContent = dyn ? "orchestrator timeout (s)" : "timeout (s)";
  $("timeout").placeholder = dyn ? "default 21600" : "none";
  $("spawnBtn").textContent = dyn ? "spawn dynamic swarm" : "spawn swarm";
  if (dyn) loadInjected(); else $("injectedPanel").style.display = "none";
}

// Presets are fetched from /api/presets (sourced from presets.json). Encrypted presets the
// server cannot decrypt (no key) come back locked:true with no prompt; we show them disabled.
const presets = new Map();          // name -> {label, mode, prompt, locked}

async function loadPresets() {
  const sel = $("presetSel");
  try {
    const data = await getJSON("/api/presets");
    presets.clear();
    sel.innerHTML = '<option value="">presets…</option>';
    for (const p of (data.presets || [])) {
      presets.set(p.name, p);
      const o = document.createElement("option");
      o.value = p.name;
      o.textContent = p.label + (p.locked ? " (locked)" : "");
      o.disabled = !!p.locked;
      o.title = p.locked ? "encrypted preset; key unavailable on the server" : (p.mode + " mode");
      sel.appendChild(o);
    }
  } catch (e) { /* no presets available; keep the placeholder option */ }
}

function applyPreset(name) {
  const p = presets.get(name);
  if (!p) { setError(name ? "unknown preset" : "pick a preset first"); return; }
  if (p.locked || typeof p.prompt !== "string") {
    setError("preset '" + (p.label || name) + "' is locked (no key on the server)");
    return;
  }
  if (p.mode) $("mode").value = p.mode;
  $("prompt").value = p.prompt; $("timeout").value = ""; applyMode(); setError("");
}

$("presetBtn").addEventListener("click", () => applyPreset($("presetSel").value));
$("presetSel").addEventListener("change", () => { if ($("presetSel").value) applyPreset($("presetSel").value); });
$("mode").addEventListener("change", applyMode);
$("harness").addEventListener("change", loadInjected);
$("model").addEventListener("change", loadInjected);

$("spawn").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("spawnBtn").disabled = true; setError("spawning…");
  try {
    const body = {
      mode: $("mode").value, harness: $("harness").value, model: $("model").value.trim(),
      count: Number($("count").value) || 1, prompt: $("prompt").value,
      goal: $("goal").checked, timeout: $("timeout").value || null,
      effort: $("effort").value || null,
      max_instances: $("maxInst").value === "" ? null : Number($("maxInst").value),
      proxy_mode: $("proxyMode").value,
    };
    const data = await getJSON("/api/spawn", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    swarmId = data.swarm; mode = data.mode || "naive";
    history.replaceState(null, "", "?swarm=" + encodeURIComponent(swarmId));
    selected = null; openFile = null; expanded.clear(); traces.clear(); runIds.clear();
    $("tree").innerHTML = ""; $("dtrace").innerHTML = '<div class="empty">select an agent…</div>';
    $("dtitle").textContent = "no agent selected"; $("dstate").textContent = "";
    setError(""); refresh();
  } catch (e) { setError(String(e.message || e)); }
  finally { $("spawnBtn").disabled = false; }
});

(async function init() {
  await loadModels();
  loadPresets();
  applyMode();
  try {
    const c = await getJSON("/api/config");
    if (!swarmId) swarmId = c.swarm || "";
    const n = c.proxies_available || 0;
    const sel = $("proxyMode");
    sel.disabled = n === 0;
    if (n === 0) sel.value = "off";
    const lbl = document.querySelector('label[for="proxyMode"]');
    if (lbl) lbl.textContent = n ? "proxies (" + n + ")" : "proxies (none)";
  } catch (e) {}
  if (swarmId) $("swarmMeta").textContent = swarmId;
  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
