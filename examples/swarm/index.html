<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aom swarm dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e6e9ef;
    --muted: #8b93a3; --accent: #6ea8fe; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
    --sel: #1b2233; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  main { padding: 16px; }
  form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 14px; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }
  form .wide { grid-column: 1 / -1; }
  label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  input, select, textarea, button { font: inherit; color: var(--text); background: #0d0f14;
    border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; width: 100%; }
  textarea { font-family: var(--mono); min-height: 64px; resize: vertical; }
  .check { display: flex; align-items: center; gap: 8px; }
  .check input { width: auto; }
  button { background: var(--accent); color: #0b1020; border: none; font-weight: 650; cursor: pointer; }
  button.ghost { background: #0d0f14; color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  details.injected { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 14px; }
  details.injected summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.injected pre { font-family: var(--mono); font-size: 11px; white-space: pre-wrap;
    max-height: 300px; overflow-y: auto; color: var(--text); margin: 10px 0 0; }

  .layout { display: flex; gap: 14px; align-items: flex-start; }
  .explorer { flex: 0 0 310px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; position: sticky; top: 16px;
    max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .detail { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .files { flex: 0 0 280px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; position: sticky; top: 16px;
    max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .phead { font-size: 12px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-family: var(--mono); display: flex; justify-content: space-between; align-items: center;
    flex: 0 0 auto; }
  .tree { overflow-y: auto; padding: 4px 0; }

  .node { display: flex; align-items: center; gap: 6px; padding: 3px 10px; font-family: var(--mono);
    font-size: 12px; white-space: nowrap; }
  .node .lbl { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .node.clickable { cursor: pointer; }
  .node.clickable:hover { background: #0d0f14; }
  .node.sel { background: var(--sel); }
  .node.orch .lbl { color: var(--accent); font-weight: 650; }
  .node.wf { font-weight: 650; cursor: pointer; }
  .node.wf .tw { color: var(--muted); width: 10px; display: inline-block; }
  .node.stage { padding-left: 24px; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: .03em; }
  .node.agent { padding-left: 34px; }
  .node .cnt { color: var(--muted); font-size: 10px; }

  .state { font-size: 10px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border);
    flex: 0 0 auto; }
  .state.running, .state.starting, .state.pending { color: var(--warn); }
  .state.done { color: var(--ok); } .state.paused { color: var(--muted); }
  .state.failed, .state.timeout, .state.cancelled { color: var(--err); }

  .dhead { padding: 10px 12px; border-bottom: 1px solid var(--border); font-family: var(--mono);
    font-size: 12px; display: flex; justify-content: space-between; align-items: center; flex: 0 0 auto; }
  .dhead .who { overflow: hidden; text-overflow: ellipsis; }
  .trace { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
    padding: 10px 12px; overflow-y: auto; margin: 0; flex: 1; min-height: 320px;
    max-height: calc(100vh - 120px); }
  .ev { padding: 1px 0; }
  .ev.thinking { color: var(--muted); } .ev.tool_call { color: var(--accent); }
  .ev.tool_result { color: #a0d8c0; } .ev.error { color: var(--err); }
  .ev.status, .ev.usage, .ev.compaction, .ev.session { color: var(--muted); }
  .ev.goal { color: var(--warn); }

  .ftree { overflow-y: auto; padding: 6px 0; font-family: var(--mono); font-size: 12px; }
  .ftree .f { padding: 2px 12px; cursor: pointer; white-space: pre; color: var(--text); }
  .ftree .f:hover { background: #0d0f14; }
  .fview { border-top: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
  .fview .path { padding: 6px 12px; color: var(--accent); font-family: var(--mono); font-size: 11px; }
  .fview pre { margin: 0; padding: 0 12px 12px; font-family: var(--mono); font-size: 11px;
    white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
  #error { color: var(--err); font-family: var(--mono); font-size: 12px; min-height: 16px; }
  .empty { color: var(--muted); padding: 20px; font-size: 13px; }

  /* loading spinner (shown while a fetch is in flight, so a pending panel is never just blank) */
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; flex: 0 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px;
    padding: 16px 12px; }
  .muted { color: var(--muted); font-weight: 400; }

  /* active model endpoints panel */
  .eprow { display: flex; gap: 10px; align-items: center; font-family: var(--mono); font-size: 12px;
    padding: 3px 2px; }
  /* dot: gray = not deployed, amber = deployed but idle (scaled to zero, no GPU cost),
     green = active (>=1 container serving now, warm/billing). */
  .eprow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: 0 0 auto; }
  .eprow.deployed .dot { background: var(--warn); }
  .eprow.active .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .eprow .nm { color: var(--text); min-width: 220px; }
  .eprow.deployed .nm { color: var(--text); }
  .eprow.active .nm { color: var(--ok); }
  .eprow .gp { color: var(--muted); } .eprow .cap { color: var(--accent); }
  .eprow .repo { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  option.active { color: var(--ok); }
  @media (max-width: 980px) {
    .layout { flex-direction: column; }
    .explorer, .files { position: static; width: 100%; flex: none; max-height: 340px; }
  }
  /* file fullscreen modal + rich rendering */
  #fsModal { position: fixed; inset: 0; z-index: 1000; background: rgba(8,10,14,.94);
    display: flex; flex-direction: column; }
  #fsModal .fs-head { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  #fsModal .fs-path { flex: 1; color: var(--accent); font-family: var(--mono); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #fsModal .fs-head button { width: auto; }
  #fsModal .fs-body { flex: 1; overflow: auto; padding: 22px 30px; }
  pre.raw, pre.json { font-family: var(--mono); font-size: 13px; white-space: pre-wrap;
    word-break: break-word; margin: 0; color: var(--text); }
  .ftree .f { user-select: none; }
  .md { color: var(--text); font-size: 15px; line-height: 1.65; max-width: 940px; }
  .md h1,.md h2,.md h3,.md h4 { line-height: 1.25; margin: 1.2em 0 .5em; font-weight: 650; }
  .md h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .md h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  .md h3 { font-size: 1.2em; } .md h4 { font-size: 1.05em; color: var(--muted); }
  .md p { margin: .6em 0; } .md ul,.md ol { margin: .6em 0; padding-left: 1.6em; }
  .md li { margin: .25em 0; } .md a { color: var(--accent); }
  .md code { font-family: var(--mono); font-size: .88em; background: #0d0f14;
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .md pre { background: #0d0f14; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; }
  .md pre code { background: none; border: none; padding: 0; }
  .md blockquote { border-left: 3px solid var(--border); margin: .6em 0; padding: .1em 1em;
    color: var(--muted); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
  .md table { border-collapse: collapse; margin: .8em 0; display: block; overflow-x: auto; }
  .md th,.md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md th { background: var(--panel); }
</style>
</head>
<body>
<header>
  <h1>aom swarm</h1>
  <span class="meta" id="swarmMeta">no swarm</span>
  <span id="error"></span>
</header>
<main>
  <form id="spawn">
    <div><label for="mode">mode</label>
      <select id="mode"><option value="naive">naive (N identical)</option>
        <option value="dynamic">dynamic (orchestrator)</option></select></div>
    <div><label for="harness">harness</label>
      <select id="harness"><option>claude</option><option>codex</option></select></div>
    <div><label for="model">model</label>
      <select id="model"><option value="">loading models…</option></select></div>
    <div id="countWrap"><label for="count">count</label>
      <input id="count" type="number" min="1" value="4" /></div>
    <div><label for="timeout" id="timeoutLabel">timeout (hours)</label>
      <input id="timeout" type="number" min="0" step="any" placeholder="none" /></div>
    <div><label for="effort">effort</label>
      <select id="effort"><option value="">default</option><option>low</option>
        <option>medium</option><option>high</option><option>xhigh</option><option>max</option></select></div>
    <div><label for="maxInst">max instances <span class="muted">(per-model, global)</span></label>
      <div style="display:flex; gap:6px;">
        <input id="maxInst" type="number" min="1" value="1" style="flex:1"
          title="This model endpoint's max GPU containers — a GLOBAL autoscaler cap SHARED by every naive/dynamic swarm on this model. Applied on spawn; click 'set' to apply now without spawning. Blank = leave the endpoint's current cap unchanged." />
        <button type="button" id="setMaxBtn" class="ghost" style="flex:0 0 auto; width:auto"
          title="apply this max to the model endpoint now (no spawn)">set</button>
      </div></div>
    <div class="check" id="goalWrap"><input id="goal" type="checkbox" />
      <label for="goal" style="margin:0">use /goal</label></div>
    <div><label for="proxyMode">proxies</label>
      <select id="proxyMode" disabled
        title="agent browser/web egress (model inference ALWAYS stays direct). always = route all agent web/browser through a residential proxy, each agent a distinct sticky IP. agent opt-in = direct by default, but the agent is given the proxy endpoints to use only when a site blocks the direct IP (saves cost). off = no proxy.">
        <option value="optin">agent opt-in</option>
        <option value="always">always on</option>
        <option value="off">off</option>
      </select></div>
    <div class="wide"><label for="prompt">prompt</label>
      <textarea id="prompt" placeholder="what should the swarm do?"></textarea></div>
    <div class="wide" style="display:flex; gap:10px;">
      <button type="submit" id="spawnBtn" style="flex:1">spawn swarm</button>
      <select id="presetSel" class="ghost" style="flex:0 0 auto; width:auto; min-width:160px"
        title="load a preset">
        <option value="">presets…</option>
      </select>
      <button type="button" id="presetBtn" class="ghost" style="flex:0 0 auto">load preset</button>
    </div>
  </form>

  <details class="injected" id="endpointsPanel" open>
    <summary>model endpoints <span class="muted" id="epCount"></span>
      <button type="button" id="epRefresh" class="ghost"
        style="width:auto; padding:2px 8px; font-size:11px; margin-left:8px;">refresh</button></summary>
    <div id="endpointsBody"><div class="loading"><span class="spinner"></span> querying endpoints…</div></div>
  </details>

  <details class="injected" id="injectedPanel" style="display:none">
    <summary>injected orchestrator context (shown exactly as the orchestrator receives it)</summary>
    <pre id="injectedText">loading…</pre>
  </details>

  <div class="layout">
    <aside class="explorer">
      <div class="phead"><span>run</span><span class="meta" id="treeCount"></span></div>
      <div class="tree" id="tree"><div class="empty">No run yet. Spawn one above, or open
        <code>?swarm=&lt;id&gt;</code>.</div></div>
    </aside>
    <section class="detail">
      <div class="dhead"><span class="who" id="dtitle">no agent selected</span>
        <span class="state" id="dstate"></span></div>
      <pre class="trace" id="dtrace"><div class="empty">Select an agent on the left to see its
        live or completed trace.</div></pre>
    </section>
    <aside class="files" id="filesPanel" style="display:none">
      <div class="phead"><span id="filesTitle">/shared</span><span class="meta" id="filesCount"></span></div>
      <div class="ftree" id="ftree"></div>
      <div class="fview" id="fview" style="display:none">
        <div class="path" id="fpath"></div><pre id="fbody"></pre>
      </div>
    </aside>
  </div>
</main>
<div id="fsModal" style="display:none" role="dialog" aria-modal="true">
  <div class="fs-head">
    <span class="fs-path" id="fsPath"></span>
    <button class="ghost" id="fsClose" title="close (Esc)">✕ close</button>
  </div>
  <div class="fs-body" id="fsBody"></div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const TERMINAL = ["done", "timeout", "failed", "cancelled", "stopped"];
let swarmId = qs.get("swarm") || "";
let mode = "naive";
let selected = null;                 // selected agent id
let openFile = null;
let fileReq = 0;                     // bumped per user file-click, to ignore superseded loads
let filesBusy = false, readBusy = false, lastFilesAt = 0;  // throttle/gate the expensive file poll
const FILES_MIN_MS = 6000;           // recursive listdir is ~1s+; don't re-list more often than this
const expanded = new Set();          // expanded workflow names
const runIds = new Map();            // agentId -> run_id
const traces = new Map();            // agentId -> {events, offset, done, runId}

function setError(msg) { $("error").textContent = msg || ""; }

async function getJSON(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
function short(v) {
  const s = typeof v === "string" ? v : JSON.stringify(v);
  return s && s.length > 300 ? s.slice(0, 299) + "…" : (s || "");
}
function stateBadge(state) {
  const sp = document.createElement("span");
  sp.className = "state " + (state || "");
  sp.textContent = state || "?";
  return sp;
}

// --------------------------------------------------------------------------- trace detail
function renderEvent(ev) {
  const div = document.createElement("div");
  div.className = "ev " + ev.kind;
  const d = ev.data || {};
  let text = "";
  switch (ev.kind) {
    case "text": text = d.text || ""; break;
    case "thinking": text = "(thinking) " + (d.text || ""); break;
    case "tool_call": text = "> " + (d.name || "?") + " " + JSON.stringify(d.input || {}); break;
    case "tool_result": text = "< " + (d.is_error ? "error " : "") + short(d.output); break;
    case "usage": text = "[usage in=" + d.input_tokens + " out=" + d.output_tokens + "]"; break;
    case "compaction": text = "[compaction]"; break;
    case "subagent": text = "[subagent " + (d.id || "") + " " + (d.status || "") + "]"; break;
    case "goal": text = "[goal " + (d.status || "") + "] " + (d.reason || ""); break;
    case "turn_end": text = d.result ? short(d.result) : ""; break;
    case "error": text = "[error] " + (d.message || ""); break;
    case "status": text = "[" + (d.event || "status") + "]"; break;
    case "session": text = "-- session " + (d.session_id || ""); break;
    default: text = d.text || JSON.stringify(d);
  }
  if (!text) return null;
  div.textContent = text;
  return div;
}

function selectAgent(id, title) {
  selected = id;
  $("dtitle").textContent = title || id;
  const t = traces.get(id);
  const pre = $("dtrace");
  pre.innerHTML = "";
  if (t && t.events.length) {
    for (const ev of t.events) { const n = renderEvent(ev); if (n) pre.appendChild(n); }
    pre.scrollTop = pre.scrollHeight;
  } else {
    pre.innerHTML = '<div class="loading"><span class="spinner"></span> waiting for trace…</div>';
  }
  highlightSelection();
  pollSelected();
}

function highlightSelection() {
  for (const el of document.querySelectorAll(".node.agentnode"))
    el.classList.toggle("sel", el.dataset.id === selected);
}

async function pollSelected() {
  if (!selected) return;
  const id = selected, runId = runIds.get(id);
  if (!runId) return;
  let t = traces.get(id);
  if (!t) { t = { events: [], offset: 0, done: false, runId, source: "" }; traces.set(id, t); }
  try {
    const data = await getJSON("/api/events?swarm=" + encodeURIComponent(swarmId)
      + "&agent=" + encodeURIComponent(id)
      + "&run=" + encodeURIComponent(runId) + "&offset=" + t.offset);
    t.offset = data.offset; t.done = data.done;
    const pre = $("dtrace");
    if (data.source === "persisted") {
      // The live sandbox is gone; the server returned the whole durable trace. Replace once
      // (idempotent across ticks) rather than appending, and only re-render when it changed.
      if (t.source !== "persisted" || (data.events || []).length !== t.events.length) {
        t.events = data.events || [];
        if (selected === id) {
          pre.innerHTML = "";
          for (const ev of t.events) { const n = renderEvent(ev); if (n) pre.appendChild(n); }
          pre.scrollTop = pre.scrollHeight;
        }
      }
    } else {
      const fresh = data.events || [];
      if (fresh.length) {
        const empty = pre.querySelector(".empty"); if (empty) empty.remove();
        t.events.push(...fresh);
        if (selected === id) {
          const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
          for (const ev of fresh) { const n = renderEvent(ev); if (n) pre.appendChild(n); }
          if (atBottom) pre.scrollTop = pre.scrollHeight;
        }
      }
    }
    t.source = data.source || "live";
    if (selected === id) {
      $("dstate").textContent = data.state; $("dstate").className = "state " + data.state;
    }
  } catch (e) { /* transient */ }
}

// --------------------------------------------------------------------------- run tree
function node(cls, label, state, { clickable, id, title, onclick } = {}) {
  const el = document.createElement("div");
  el.className = "node " + cls + (clickable ? " clickable" : "");
  if (clickable) el.classList.add("agentnode");
  if (id) el.dataset.id = id;
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = label; if (title) lbl.title = title;
  el.appendChild(lbl);
  if (state) el.appendChild(stateBadge(state));
  if (onclick) el.onclick = onclick;
  return el;
}

function renderTree(data) {
  const tree = $("tree");
  tree.innerHTML = "";
  const agents = data.agents || [];
  const workflows = data.workflows || [];
  runIds.clear();
  for (const a of agents) if (a.run_id) runIds.set(a.id, a.run_id);

  const orch = agents.find((a) => a.role === "orchestrator");
  if (orch) {
    tree.appendChild(node("orch", "orchestrator", orch.state,
      { clickable: true, id: orch.id, title: orch.id,
        onclick: () => selectAgent(orch.id, "orchestrator") }));
  }

  if (mode === "dynamic") {
    if (!workflows.length && !orch)
      tree.appendChild(elEmpty("orchestrator is planning… no workflows submitted yet"));
    for (const wf of workflows) {
      const stages = wf.stages || [];
      const open = expanded.has(wf.name);
      const head = node("wf", (open ? "▾ " : "▸ ") + wf.name, wf.status,
        { title: wf.name + " — " + stages.length + " stage(s)" });
      head.onclick = () => { open ? expanded.delete(wf.name) : expanded.add(wf.name); renderTree(data); };
      tree.appendChild(head);
      if (!open) continue;
      for (const st of stages) {
        const sas = st.agents || [];
        const done = sas.filter((a) => TERMINAL.includes(a.state)).length;
        const sh = node("stage", st.name, st.status, { title: st.name });
        const cnt = document.createElement("span");
        cnt.className = "cnt"; cnt.textContent = done + "/" + sas.length;
        sh.insertBefore(cnt, sh.querySelector(".state"));
        tree.appendChild(sh);
        for (const a of sas) {
          if (a.run_id) runIds.set(a.id, a.run_id);
          const label = "agent " + (a.idx !== undefined && a.idx !== null ? a.idx : "?");
          tree.appendChild(node("agent", label, a.state,
            { clickable: true, id: a.id, title: a.id,
              onclick: () => selectAgent(a.id, wf.name + " · " + st.name + " · " + label) }));
        }
      }
    }
  } else {
    for (const a of agents.filter((x) => x.role !== "orchestrator")) {
      const label = "agent " + (a.idx !== undefined && a.idx !== null ? a.idx : a.id.slice(0, 10));
      tree.appendChild(node("agent", label, a.state,
        { clickable: true, id: a.id, title: a.id, onclick: () => selectAgent(a.id, label) }));
    }
  }
  if (!tree.children.length) tree.appendChild(elEmpty("no agents yet"));
  $("treeCount").textContent = agents.length + " agent" + (agents.length === 1 ? "" : "s");
  highlightSelection();
}

function elEmpty(msg) { const d = document.createElement("div"); d.className = "empty"; d.textContent = msg; return d; }

// --------------------------------------------------------------------------- refresh loop
async function refresh() {
  if (!swarmId) return;
  try {
    const data = await getJSON("/api/agents?swarm=" + encodeURIComponent(swarmId));
    setError("");
    mode = data.mode || "naive";
    $("swarmMeta").textContent = data.swarm + " · " + (data.model || "?") + " · " + mode
      + " · " + (data.agents || []).length + " agents";
    renderTree(data);
    // auto-select the orchestrator (dynamic) or the first agent (naive) once.
    if (!selected && (data.agents || []).length) {
      const orch = data.agents.find((a) => a.role === "orchestrator");
      const first = orch || data.agents[0];
      if (first) selectAgent(first.id, orch ? "orchestrator"
        : ("agent " + (first.idx != null ? first.idx : first.id.slice(0, 10))));
    }
    if (selected) { const t = traces.get(selected); if (!t || !t.done) pollSelected(); }
    if (mode === "dynamic") { $("filesPanel").style.display = ""; refreshFiles(); }
    else $("filesPanel").style.display = "none";
  } catch (e) { setError(String(e.message || e)); }
}

// --------------------------------------------------------------------------- file explorer
async function refreshFiles() {
  if (!swarmId) return;
  // The recursive listdir is ~1s+ on a large shared volume and the Modal client serializes RPCs,
  // so throttle it and never let it run while a file read is in flight (it would delay a click).
  if (readBusy || filesBusy || Date.now() - lastFilesAt < FILES_MIN_MS) return;
  filesBusy = true; lastFilesAt = Date.now();
  const ft = $("ftree");
  if (!ft.children.length)  // first load: spinner instead of a blank panel
    ft.innerHTML = '<div class="loading"><span class="spinner"></span> loading files…</div>';
  try {
    const data = await getJSON("/api/files?swarm=" + encodeURIComponent(swarmId) + "&path=/");
    const paths = data.paths || [];
    $("filesCount").textContent = paths.length + " files";
    const tree = $("ftree"); tree.innerHTML = "";
    for (const p of paths) {
      const depth = (p.match(/\//g) || []).length;
      const div = document.createElement("div");
      div.className = "f";
      div.textContent = "  ".repeat(Math.max(0, depth - 1)) + p.split("/").filter(Boolean).pop();
      div.title = p;
      div.onclick = () => viewFile(p, true);
      tree.appendChild(div);
    }
    if (!paths.length) tree.innerHTML = '<div class="empty">no shared files yet</div>';
    if (openFile) viewFile(openFile);
  } catch (e) { /* no volume yet */ }
  finally { filesBusy = false; }
}

async function viewFile(path, click) {
  openFile = path;
  // A user click pops the fullscreen viewer immediately with a spinner so the UI feels responsive
  // even on a big file or a cold volume; it fills in when the fetch returns. Background refreshes
  // (no click) just update the inline panel silently and never touch the modal or the token.
  const token = click ? ++fileReq : fileReq;
  if (click) openFullscreenLoading(path);
  readBusy = true;   // pause the files poll while a read is in flight (the Modal client serializes RPCs)
  try {
    const data = await getJSON("/api/file?swarm=" + encodeURIComponent(swarmId)
      + "&path=" + encodeURIComponent(path));
    if (click && token !== fileReq) return;   // a newer click superseded this load
    $("fview").style.display = "";
    $("fpath").textContent = data.path + (data.truncated ? "  (truncated)" : "");
    $("fbody").textContent = data.text || "(empty)";
    // a click opens the file full-screen with rich rendering (.json pretty-printed, .md rendered)
    if (click) openFullscreen(data.path, data.text || "");
  } catch (e) {
    if (click && token !== fileReq) return;
    if (click) $("fsBody").innerHTML = '<pre class="raw" style="color:var(--err)">could not read file — '
      + esc(e.message || e) + '</pre>';
    else setError(String(e.message || e));
  } finally { readBusy = false; }
}

// --------------------------------------------------------------------------- form + endpoints
// model name -> live endpoint status {deployed, max_containers, min_containers, gpu, repo}. A model
// endpoint is a shared, account-level resource: all naive/dynamic swarms on the same model hit the
// same Modal app under one autoscaler, so `max_containers` is a GLOBAL cap they all share.
const endpoints = new Map();

function decorateModelOptions() {
  // mark deployed models in the dropdown: green ● = active (containers up now), ○ = deployed but
  // idle (attachable, will cold-start), plain = not deployed. Green stays "running right now".
  for (const o of $("model").options) {
    const base = o.dataset.base || o.value; o.dataset.base = base;
    const ep = endpoints.get(o.value);
    const cap = ep && ep.max_containers != null ? "  [max " + ep.max_containers + "]" : "";
    if (ep && ep.active) {
      o.classList.add("active");
      o.textContent = "● " + base + cap;
    } else if (ep && ep.deployed) {
      o.classList.remove("active");
      o.textContent = "○ " + base + cap;
    } else {
      o.classList.remove("active");
      o.textContent = base;
    }
  }
}

function prefillMaxForModel() {
  // reflect the selected model's CURRENT global cap in the field (so it's clear it's per-model).
  const ep = endpoints.get($("model").value);
  if (ep && ep.deployed && ep.max_containers != null) $("maxInst").value = ep.max_containers;
}

async function loadModels() {
  const sel = $("model"); const cur = sel.value || (sel.options[0] ? sel.options[0].value : "");
  sel.disabled = true; sel.innerHTML = '<option value="">loading…</option>';
  try {
    const data = await getJSON("/api/models");
    sel.innerHTML = "";
    for (const m of (data.models || [])) {
      const o = document.createElement("option");
      o.value = m.name;
      // the catalog name + full Hugging Face repo (value stays the catalog name)
      o.dataset.base = m.repo ? m.name + " — " + m.repo : m.name;
      o.textContent = o.dataset.base;
      o.title = (m.repo ? m.repo + "\n" : "") + (m.gpu ? m.gpu + " · " : "")
        + (m.context_window ? m.context_window + " ctx · " : "") + (m.description || "");
      sel.appendChild(o);
    }
    if (!sel.options.length) { const o = document.createElement("option"); o.value = cur; o.textContent = cur; sel.appendChild(o); }
    if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
    decorateModelOptions();
  } catch (e) { sel.innerHTML = '<option value="' + cur + '">' + cur + '</option>'; }
  finally { sel.disabled = false; }
}

async function loadEndpoints() {
  const body = $("endpointsBody");
  body.innerHTML = '<div class="loading"><span class="spinner"></span> querying endpoints…</div>';
  try {
    const data = await getJSON("/api/endpoints");
    endpoints.clear();
    for (const e of (data.endpoints || [])) endpoints.set(e.name, e);
    renderEndpoints(data.endpoints || []);
    decorateModelOptions();
    prefillMaxForModel();
  } catch (e) {
    body.innerHTML = '<div class="empty">could not load endpoints: ' + (e.message || e) + "</div>";
  }
}

function renderEndpoints(list) {
  const body = $("endpointsBody");
  // Three distinct states: active (containers up now) / deployed-but-idle / not deployed.
  const nActive = list.filter((e) => e.active).length;
  const nDeployed = list.filter((e) => e.deployed).length;
  $("epCount").textContent = "(" + nActive + " active / " + nDeployed + " deployed / " + list.length + ")";
  body.innerHTML = "";
  const rank = (e) => (e.active ? 0 : e.deployed ? 1 : 2);  // active first, then idle, then not deployed
  const sorted = [...list].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
  for (const e of sorted) {
    const row = document.createElement("div");
    row.className = "eprow" + (e.active ? " active" : e.deployed ? " deployed" : "");
    const limits = "max " + (e.max_containers != null ? e.max_containers : "?")
      + (e.min_containers ? " · min " + e.min_containers : "");
    let cap, tip;
    if (!e.deployed) {
      cap = "not deployed"; tip = "not deployed (no Modal app)";
    } else if (e.active) {
      cap = (e.active_containers != null ? e.active_containers + " up · " : "") + limits;
      tip = (e.active_containers || "?") + " container(s) serving now — warm, billing";
    } else {
      cap = "idle · " + limits;
      tip = "deployed but scaled to zero — cold, no GPU cost until the first request";
    }
    row.title = tip;
    for (const [cls, txt] of [["dot", ""], ["nm", e.name], ["gp", e.gpu || ""],
                              ["cap", cap], ["repo", e.repo || ""]]) {
      const s = document.createElement("span"); s.className = cls; s.textContent = txt; row.appendChild(s);
    }
    body.appendChild(row);
  }
}

async function loadInjected() {
  if ($("mode").value !== "dynamic") { $("injectedPanel").style.display = "none"; return; }
  $("injectedPanel").style.display = "";
  try {
    const data = await getJSON("/api/injected?harness=" + encodeURIComponent($("harness").value)
      + "&model=" + encodeURIComponent($("model").value.trim()));
    $("injectedText").textContent = data.text || "";
  } catch (e) { $("injectedText").textContent = "could not load: " + (e.message || e); }
}

function applyMode() {
  const dyn = $("mode").value === "dynamic";
  $("countWrap").style.display = dyn ? "none" : "";
  $("goalWrap").style.display = dyn ? "none" : "";
  // timeout is in fractional HOURS in BOTH modes (converted to seconds on submit): dynamic prefills
  // its real default (6h); naive states plainly that blank means no limit. Editable either way.
  const to = $("timeout");
  if (dyn) {
    $("timeoutLabel").textContent = "orchestrator timeout (hours)";
    to.placeholder = "default 6";
    to.title = "Dynamic: max hours the orchestrator may run (fractional ok, e.g. 0.5). Blank = default 6h.";
    if (!to.value) to.value = "6";
  } else {
    $("timeoutLabel").textContent = "timeout / agent (hours)";
    to.placeholder = "blank = no limit";
    to.title = "Naive: max hours EACH agent may run (fractional ok, e.g. 0.5). Blank = no limit (runs until done or crash).";
    if (to.value === "6") to.value = "";
  }
  $("spawnBtn").textContent = dyn ? "spawn dynamic swarm" : "spawn swarm";
  if (dyn) loadInjected(); else $("injectedPanel").style.display = "none";
}

// Presets are fetched from /api/presets (sourced from presets.json). Encrypted presets the
// server cannot decrypt (no key) come back locked:true with no prompt; we show them disabled.
const presets = new Map();          // name -> {label, mode, prompt, locked}

async function loadPresets() {
  const sel = $("presetSel");
  try {
    const data = await getJSON("/api/presets");
    presets.clear();
    sel.innerHTML = '<option value="">presets…</option>';
    for (const p of (data.presets || [])) {
      presets.set(p.name, p);
      const o = document.createElement("option");
      o.value = p.name;
      o.textContent = p.label + (p.locked ? " (locked)" : "");
      o.disabled = !!p.locked;
      o.title = p.locked ? "encrypted preset; key unavailable on the server" : (p.mode + " mode");
      sel.appendChild(o);
    }
  } catch (e) { /* no presets available; keep the placeholder option */ }
}

function applyPreset(name) {
  const p = presets.get(name);
  if (!p) { setError(name ? "unknown preset" : "pick a preset first"); return; }
  if (p.locked || typeof p.prompt !== "string") {
    setError("preset '" + (p.label || name) + "' is locked (no key on the server)");
    return;
  }
  if (p.mode) $("mode").value = p.mode;
  $("prompt").value = p.prompt; $("timeout").value = ""; applyMode(); setError("");
}

$("presetBtn").addEventListener("click", () => applyPreset($("presetSel").value));
$("presetSel").addEventListener("change", () => { if ($("presetSel").value) applyPreset($("presetSel").value); });
$("mode").addEventListener("change", applyMode);
$("harness").addEventListener("change", loadInjected);
$("model").addEventListener("change", () => { prefillMaxForModel(); loadInjected(); });

$("epRefresh").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); loadEndpoints(); });
$("setMaxBtn").addEventListener("click", async () => {
  const model = $("model").value.trim(), mi = $("maxInst").value;
  if (!model || mi === "") { setError("pick a model and a max to set"); return; }
  $("setMaxBtn").disabled = true; setError("setting " + model + " endpoint max…");
  try {
    const d = await getJSON("/api/scale", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, max_instances: Number(mi) }),
    });
    setError("set " + d.model + " endpoint max → " + d.max_containers + " (global, shared by all swarms)");
    loadEndpoints();
  } catch (e) { setError(String(e.message || e)); }
  finally { $("setMaxBtn").disabled = false; }
});

$("spawn").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("spawnBtn").disabled = true; setError("spawning…");
  try {
    const body = {
      mode: $("mode").value, harness: $("harness").value, model: $("model").value.trim(),
      count: Number($("count").value) || 1, prompt: $("prompt").value,
      goal: $("goal").checked,
      timeout: $("timeout").value ? Number($("timeout").value) * 3600 : null,  // hours -> seconds
      effort: $("effort").value || null,
      max_instances: $("maxInst").value === "" ? null : Number($("maxInst").value),
      proxy_mode: $("proxyMode").value,
    };
    const data = await getJSON("/api/spawn", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    swarmId = data.swarm; mode = data.mode || "naive";
    history.replaceState(null, "", "?swarm=" + encodeURIComponent(swarmId));
    selected = null; openFile = null; expanded.clear(); traces.clear(); runIds.clear(); lastFilesAt = 0;
    $("tree").innerHTML = ""; $("dtrace").innerHTML = '<div class="empty">select an agent…</div>';
    $("dtitle").textContent = "no agent selected"; $("dstate").textContent = "";
    setError(""); refresh();
  } catch (e) { setError(String(e.message || e)); }
  finally { $("spawnBtn").disabled = false; }
});

(async function init() {
  await loadModels();
  loadPresets();
  loadEndpoints();          // async: fills the endpoints panel + decorates the dropdown when it returns
  applyMode();
  try {
    const c = await getJSON("/api/config");
    if (!swarmId) swarmId = c.swarm || "";
    const n = c.proxies_available || 0;
    const sel = $("proxyMode");
    if (sel) {
      sel.disabled = n === 0;
      if (n === 0) sel.value = "off";
      const lbl = document.querySelector('label[for="proxyMode"]');
      if (lbl) lbl.textContent = n ? "proxies (" + n + ")" : "proxies (none)";
    }
  } catch (e) {}
  if (swarmId) {
    $("swarmMeta").textContent = swarmId;
    $("tree").innerHTML = '<div class="loading"><span class="spinner"></span> loading run…</div>';
  }
  refresh();
  setInterval(refresh, 2000);
})();
// ---- file rich rendering + fullscreen -------------------------------------------------------
let fsPathCur = null;
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function mdInline(t) {
  return t
    .replace(/`([^`]+)`/g, (m, c) => "<code>" + c + "</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(src) {
  const lines = esc(src).replace(/\r\n?/g, "\n").split("\n");
  const out = []; let i = 0;
  const isBlock = (l) => /^(#{1,6}\s|```|\s*[-*]\s|\s*\d+\.\s|\s*>\s|\s*(-{3,}|\*{3,})\s*$)/.test(l);
  while (i < lines.length) {
    const ln = lines[i];
    if (/^```/.test(ln)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; out.push("<pre><code>" + buf.join("\n") + "</code></pre>"); continue;
    }
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = h[1].length; out.push("<h" + n + ">" + mdInline(h[2]) + "</h" + n + ">"); i++; continue; }
    if (/^\s*[-*]\s+/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { buf.push("<li>" + mdInline(lines[i].replace(/^\s*[-*]\s+/, "")) + "</li>"); i++; }
      out.push("<ul>" + buf.join("") + "</ul>"); continue;
    }
    if (/^\s*\d+\.\s+/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { buf.push("<li>" + mdInline(lines[i].replace(/^\s*\d+\.\s+/, "")) + "</li>"); i++; }
      out.push("<ol>" + buf.join("") + "</ol>"); continue;
    }
    if (/^\s*>\s?/.test(ln)) { out.push("<blockquote>" + mdInline(ln.replace(/^\s*>\s?/, "")) + "</blockquote>"); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(ln)) { out.push("<hr>"); i++; continue; }
    if (/\|/.test(ln) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      const row = (r) => r.replace(/^\s*\|?|\|?\s*$/g, "").split("|").map((c) => c.trim());
      const head = row(ln); i += 2; const body = [];
      while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) { body.push(row(lines[i])); i++; }
      out.push("<table><thead><tr>" + head.map((c) => "<th>" + mdInline(c) + "</th>").join("") +
        "</tr></thead><tbody>" + body.map((r) => "<tr>" + r.map((c) => "<td>" + mdInline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }
    if (ln.trim() === "") { i++; continue; }
    const buf = [ln]; i++;
    while (i < lines.length && lines[i].trim() !== "" && !isBlock(lines[i])) { buf.push(lines[i]); i++; }
    out.push("<p>" + mdInline(buf.join(" ")) + "</p>");
  }
  return out.join("\n");
}
function renderInto(el, path, text) {
  const p = (path || "").toLowerCase();
  if (p.endsWith(".json")) {
    let pretty = text || "";
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* keep raw */ }
    el.innerHTML = '<pre class="json">' + esc(pretty) + "</pre>";
  } else if (p.endsWith(".md") || p.endsWith(".markdown")) {
    el.innerHTML = '<div class="md">' + mdToHtml(text || "") + "</div>";
  } else {
    el.innerHTML = '<pre class="raw">' + esc(text || "(empty)") + "</pre>";
  }
}
function openFullscreenLoading(path) {
  fsPathCur = path;
  $("fsPath").textContent = path;
  $("fsBody").innerHTML = '<div class="loading"><span class="spinner"></span> reading '
    + esc((path || "").split("/").pop()) + ' …</div>';
  $("fsModal").style.display = "flex";
}
function openFullscreen(path, text) {
  fsPathCur = path;
  $("fsPath").textContent = path;
  renderInto($("fsBody"), path, text);
  $("fsModal").style.display = "flex";
}
function closeFullscreen() { $("fsModal").style.display = "none"; fsPathCur = null; }
$("fsClose").addEventListener("click", closeFullscreen);
$("fsModal").addEventListener("click", (e) => { if (e.target.id === "fsModal") closeFullscreen(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("fsModal").style.display !== "none") closeFullscreen(); });
</script>
</body>
